<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#121212">
  <title>Guitar Pitch Tuner</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 100vh;
      padding: 15px;
      user-select: none;
    }

    header {
      margin-top: 5px;
      text-align: center;
      width: 100%;
      max-width: 400px;
    }
    header h1 { font-size: 1.2rem; color: #888; text-transform: uppercase; letter-spacing: 2px; }

    .tuner-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 400px;
    }

    .note-display {
      font-size: 4.5rem;
      font-weight: bold;
      height: 90px;
      line-height: 90px;
      color: #333;
      transition: color 0.2s ease;
    }

    .frequency-display {
      font-size: 1rem;
      color: #666;
      height: 20px;
    }

    /* Gauge / Meter Visual */
    .meter {
      position: relative;
      width: 100%;
      height: 8px;
      background-color: #222;
      border-radius: 4px;
      margin: 15px 0 10px 0;
      overflow: visible;
    }

    .meter-center {
      position: absolute;
      left: 50%;
      top: -4px;
      width: 2px;
      height: 16px;
      background-color: #00ff6b;
      transform: translateX(-50%);
    }

    .meter-pointer {
      position: absolute;
      left: 50%;
      top: -6px;
      width: 14px;
      height: 20px;
      background-color: #888;
      border-radius: 3px;
      transform: translateX(-50%);
      transition: left 0.1s ease-out, background-color 0.2s;
    }

    /* Status indicator colors */
    .in-tune { color: #00ff6b !important; }
    .flat { color: #ff3b30 !important; }
    .sharp { color: #ffcc00 !important; }

    .meter-pointer.in-tune { background-color: #00ff6b; }
    .meter-pointer.flat { background-color: #ff3b30; }
    .meter-pointer.sharp { background-color: #ffcc00; }

    /* Visual Classical Headstock Container */
    .headstock-wrapper {
      width: 100%;
      max-width: 260px;
      margin: 10px 0;
    }

    svg.headstock {
      width: 100%;
      height: auto;
      filter: drop-shadow(0px 10px 15px rgba(0,0,0,0.5));
    }

    /* Interactive Peg Elements */
    .peg-group {
      cursor: pointer;
    }

    .peg-body {
      fill: #222;
      stroke: #555;
      stroke-width: 2;
      transition: all 0.2s;
    }

    .peg-text {
      font-size: 11px;
      font-weight: bold;
      fill: #888;
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
    }

    .string-line {
      stroke: #555;
      stroke-width: 2;
      transition: stroke 0.2s, stroke-width 0.2s;
    }

    /* Active dynamic state styles */
    .peg-group.active .peg-body {
      fill: #00ff6b;
      stroke: #00ff6b;
    }
    .peg-group.active .peg-text {
      fill: #000;
    }
    .string-line.active {
      stroke: #00ff6b;
      stroke-width: 3.5;
    }

    /* Control Button */
    .btn-start {
      background-color: #00ff6b;
      color: #000;
      border: none;
      padding: 12px 35px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      margin-bottom: 15px;
      box-shadow: 0 4px 15px rgba(0, 255, 107, 0.3);
      transition: transform 0.1s;
    }

    .btn-start:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>

  <header>
    <h1>String Theory Tuner</h1>
  </header>

  <div class="tuner-container">
    <div id="note" class="note-display">--</div>
    <div id="frequency" class="frequency-display">Click Start to Tune</div>

    <div class="meter">
      <div class="meter-center"></div>
      <div id="pointer" class="meter-pointer"></div>
    </div>

    <!-- Classical Guitar Headstock Visual -->
    <div class="headstock-wrapper">
      <svg class="headstock" viewBox="0 0 200 280">
        <!-- Wooden Headstock Outline -->
        <path d="M 40 280 L 40 90 C 40 40, 60 10, 100 10 C 140 10, 160 40, 160 90 L 160 280 Z" fill="#2d1d18" stroke="#4a2e24" stroke-width="4"/>
        
        <!-- Slotted Openings (Classical Guitar Style) -->
        <rect x="52" y="50" width="28" height="150" rx="14" fill="#121212" stroke="#1f1411" stroke-width="2"/>
        <rect x="120" y="50" width="28" height="150" rx="14" fill="#121212" stroke="#1f1411" stroke-width="2"/>

        <!-- Bone Nut at the base -->
        <rect x="36" y="270" width="128" height="10" rx="2" fill="#e6dfcc"/>

        <!-- Strings (E2, A2, D3, G3, B3, E4) -->
        <line id="str-E2" class="string-line" x1="60" y1="170" x2="50" y2="270" />
        <line id="str-A2" class="string-line" x1="60" y1="110" x2="66" y2="270" />
        <line id="str-D3" class="string-line" x1="60" y1="65"  x2="82" y2="270" />
        <line id="str-G3" class="string-line" x1="140" y1="65"  x2="118" y2="270" />
        <line id="str-B3" class="string-line" x1="140" y1="110" x2="134" y2="270" />
        <line id="str-E4" class="string-line" x1="140" y1="170" x2="150" y2="270" />

        <!-- Left Pegs (E2, A2, D3) -->
        <g id="peg-E2" class="peg-group">
          <rect class="peg-body" x="8" y="158" width="30" height="24" rx="12"/>
          <text class="peg-text" x="23" y="170">E2</text>
        </g>
        <g id="peg-A2" class="peg-group">
          <rect class="peg-body" x="8" y="98" width="30" height="24" rx="12"/>
          <text class="peg-text" x="23" y="110">A2</text>
        </g>
        <g id="peg-D3" class="peg-group">
          <rect class="peg-body" x="8" y="53" width="30" height="24" rx="12"/>
          <text class="peg-text" x="23" y="65">D3</text>
        </g>

        <!-- Right Pegs (G3, B3, E4) -->
        <g id="peg-G3" class="peg-group">
          <rect class="peg-body" x="162" y="53" width="30" height="24" rx="12"/>
          <text class="peg-text" x="177" y="65">G3</text>
        </g>
        <g id="peg-B3" class="peg-group">
          <rect class="peg-body" x="162" y="98" width="30" height="24" rx="12"/>
          <text class="peg-text" x="177" y="110">B3</text>
        </g>
        <g id="peg-E4" class="peg-group">
          <rect class="peg-body" x="162" y="158" width="30" height="24" rx="12"/>
          <text class="peg-text" x="177" y="170">E4</text>
        </g>
      </svg>
    </div>
  </div>

  <button id="start-btn" class="btn-start">Start Tuner</button>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    let audioCtx;
    let analyser;
    let microphone;
    let isListening = false;
    const bufferLength = 2048;
    const buffer = new Float32Array(bufferLength);
    const noteNames = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
    
    // UI Elements
    const startBtn = document.getElementById('start-btn');
    const noteEl = document.getElementById('note');
    const freqEl = document.getElementById('frequency');
    const pointerEl = document.getElementById('pointer');

    startBtn.addEventListener('click', () => {
      if (!isListening) {
        initAudio();
      } else {
        stopAudio();
      }
    });

    async function initAudio() {
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        
        microphone = audioCtx.createMediaStreamSource(stream);
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = bufferLength;
        
        microphone.connect(analyser);
        
        isListening = true;
        startBtn.innerText = "Stop";
        startBtn.style.backgroundColor = "#ff3b30";
        startBtn.style.color = "#fff";
        
        updatePitch();
      } catch (err) {
        alert("Microphone access is required to use the tuner.");
        console.error(err);
      }
    }

    function stopAudio() {
      if (audioCtx) audioCtx.close();
      isListening = false;
      startBtn.innerText = "Start Tuner";
      startBtn.style.backgroundColor = "#00ff6b";
      startBtn.style.color = "#000";
      noteEl.innerText = "--";
      noteEl.className = "note-display";
      freqEl.innerText = "Click Start to Tune";
      pointerEl.style.left = "50%";
      pointerEl.className = "meter-pointer";
      clearActiveStrings();
    }

    function autoCorrelate(buf, sampleRate) {
      let SIZE = buf.length;
      let rms = 0;

      for (let i = 0; i < SIZE; i++) {
        let val = buf[i];
        rms += val * val;
      }
      rms = Math.sqrt(rms / SIZE);

      if (rms < 0.01) return -1;

      let r1 = 0, r2 = SIZE - 1, thres = 0.2;
      for (let i = 0; i < SIZE / 2; i++) {
        if (Math.abs(buf[i]) < thres) { r1 = i; break; }
      }
      for (let i = 1; i < SIZE / 2; i++) {
        if (Math.abs(buf[SIZE - i]) < thres) { r2 = SIZE - i; break; }
      }

      buf = buf.slice(r1, r2);
      SIZE = buf.length;

      let c = new Array(SIZE).fill(0);
      for (let i = 0; i < SIZE; i++) {
        for (let j = 0; j < SIZE - i; j++) {
          c[i] = c[i] + buf[j] * buf[j + i];
        }
      }

      let d = 0;
      while (c[d] > c[d + 1]) d++;
      let maxval = -1, maxpos = -1;

      for (let i = d; i < SIZE; i++) {
        if (c[i] > maxval) {
          maxval = c[i];
          maxpos = i;
        }
      }
      let T0 = maxpos;

      let x1 = c[T0 - 1], x2 = c[T0], x3 = c[T0 + 1];
      let a = (x1 + x3 - 2 * x2) / 2;
      let b = (x3 - x1) / 2;
      if (a) T0 = T0 - b / (2 * a);

      return sampleRate / T0;
    }

    function updatePitch() {
      if (!isListening) return;

      analyser.getFloatTimeDomainData(buffer);
      const pitch = autoCorrelate(buffer, audioCtx.sampleRate);

      if (pitch !== -1) {
        const noteNum = 12 * (Math.log(pitch / 440) / Math.log(2)) + 69;
        const roundedNote = Math.round(noteNum);
        const cents = Math.floor((noteNum - roundedNote) * 100);
        const noteName = noteNames[roundedNote % 12];
        const octave = Math.floor(roundedNote / 12) - 1;
        const fullNote = noteName + octave;

        noteEl.innerText = noteName;
        freqEl.innerText = `${pitch.toFixed(1)} Hz`;

        let meterPercentage = 50 + (cents);
        meterPercentage = Math.max(5, Math.min(95, meterPercentage));
        pointerEl.style.left = `${meterPercentage}%`;

        clearActiveStrings();
        let targetPeg = document.getElementById(`peg-${fullNote}`);
        let targetString = document.getElementById(`str-${fullNote}`);
        
        if (targetPeg) targetPeg.classList.add('active');
        if (targetString) targetString.classList.add('active');

        if (Math.abs(cents) <= 4) {
          noteEl.className = "note-display in-tune";
          pointerEl.className = "meter-pointer in-tune";
        } else if (cents < 0) {
          noteEl.className = "note-display flat";
          pointerEl.className = "meter-pointer flat";
        } else {
          noteEl.className = "note-display sharp";
          pointerEl.className = "meter-pointer sharp";
        }
      }

      requestAnimationFrame(updatePitch);
    }

    function clearActiveStrings() {
      document.querySelectorAll('.peg-group').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.string-line').forEach(s => s.classList.remove('active'));
    }
  </script>
</body>
</html>
